<!-- 파티 신청 때 사용하는 컴포넌트-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party_Join</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        height: 100%;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div
      th:fragment="party-join-card"
      class="flex flex-col justify-start items-start w-[360px] relative overflow-hidden gap-4 px-6 py-6 rounded-xl bg-white shadow-lg"
    >
      <!-- 서비스명(파티 제목) -->
      <div class="flex items-center gap-4">
        <p class="text-sm font-medium text-gray-700">파티명:</p>
        <p class="text-sm font-medium text-gray-900" th:text="${party.title}">
          파티명
        </p>
      </div>

      <!-- 기간(마감일) -->
      <div class="flex items-center gap-4">
        <p class="text-sm font-medium text-gray-700">마감일:</p>
        <p
          class="text-sm font-medium text-gray-900"
          th:text="${party.deadline}"
        >
          YYYY/MM/DD
        </p>
      </div>

      <!-- 오픈채팅방 -->
      <div class="flex items-center gap-4">
        <p class="text-sm font-medium text-gray-700">오픈채팅방:</p>
        <a
          href="#"
          class="text-sm font-medium text-blue-500 hover:underline"
          th:href="${party.chatLink}"
          th:text="${party.chatLink}"
        >
          www.naver.com
        </a>
      </div>

      <!-- 파티장 -->
      <div class="flex items-center gap-4">
        <p class="text-sm font-medium text-gray-700">파티장:</p>
        <p
          class="text-sm font-medium text-gray-900"
          th:text="${party.creator != null ? party.creator.nickname : '알 수 없음'}"
        >
          파티장
        </p>
      </div>

      <!-- 모집 인원 -->
      <div class="flex items-center gap-4">
        <p class="text-sm font-medium text-gray-700">모집 인원:</p>
        <p class="text-sm font-medium text-gray-900">
          <span th:text="${party.maxMembers}">0</span> 명
        </p>
      </div>
    </div>
  </body>
</html>
