<!-- party-detail 컴포넌트-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Detail Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <main
      th:fragment="party-detail-content"
      class="flex flex-col items-center justify-center min-h-screen px-2 py-12 bg-gray-50"
    >
      <!-- 파티 제목 -->
      <section
        class="bg-white rounded-lg shadow-lg p-6 w-full max-w-3xl text-center"
      >
        <h1 class="text-3xl font-bold text-gray-800" th:text="${party.title}">
          파티 제목
        </h1>
        <p class="text-lg text-gray-600 mt-2" th:text="${party.category}">
          카테고리
        </p>
      </section>

      <!-- 파티 정보 -->
      <section
        class="bg-gray-100 rounded-lg shadow-md p-6 w-full max-w-3xl mt-6"
      >
        <div class="grid grid-cols-2 gap-6 sm:grid-cols-1">
          <!-- 참여 비용 -->
          <div class="flex flex-col">
            <p class="text-gray-700 font-medium">참여 비용:</p>
            <p class="text-gray-900 font-bold" th:text="${party.cost}">0원</p>
          </div>
          <!-- 모집 마감일 -->
          <div class="flex flex-col">
            <p class="text-gray-700 font-medium">모집 마감일:</p>
            <p class="text-gray-900 font-bold" th:text="${party.deadline}">
              YYYY/MM/DD
            </p>
          </div>
          <!-- 모집 인원 -->
          <div class="flex flex-col">
            <p class="text-gray-700 font-medium">모집 인원:</p>
            <p class="text-gray-900 font-bold">
              <span th:text="${party.maxMembers}">0</span> 명
            </p>
          </div>
          <!-- 오픈채팅 링크 -->
          <div class="flex flex-col">
            <p class="text-gray-700 font-medium">오픈채팅 링크:</p>
            <a
              class="text-blue-600 underline"
              th:href="${party.chatLink}"
              th:text="${party.chatLink}"
            >
              오픈채팅
            </a>
          </div>
          <!-- 파티장 -->
          <div class="flex flex-col">
            <p class="text-gray-700 font-medium">파티장:</p>
            <p
              class="text-gray-900 font-bold"
              th:text="${party.creator != null ? party.creator.name : '알 수 없음'}"
            >
              파티장
            </p>
          </div>
        </div>
      </section>

      <!-- 상세 설명 -->
      <section class="bg-white rounded-lg shadow-md p-6 w-full max-w-3xl mt-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">상세 설명</h2>
        <p class="text-gray-700" th:text="${party.title}">상세 설명</p>
      </section>

      <!-- 참여하기 및 뒤로가기 버튼 -->
      <div class="mt-6 flex gap-4 justify-center">
        <!-- 뒤로가기 버튼 -->
        <button
          class="px-6 py-3 bg-gray-300 text-gray-700 text-lg font-medium rounded-lg hover:bg-gray-400 transition"
          th:onclick="|location.href='@{/party/main-games}'|"
          aria-label="뒤로가기"
        >
          뒤로가기
        </button>

        <!-- 참여하기 버튼 -->
        <button
          class="px-6 py-3 bg-blue-500 text-white text-lg font-medium rounded-lg hover:bg-blue-600 transition"
          th:onclick="|location.href='@{/Join-Question}'|"
          aria-label="파티 참여하기"
        >
          참여하기
        </button>
      </div>
    </main>
  </body>
</html>
