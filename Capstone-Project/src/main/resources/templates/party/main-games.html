<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mainpage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- 헤더 -->
    <div th:replace="~{component/Header :: header}"></div>

    <!-- 사이드바 -->
    <div th:replace="~{component/My-menu :: my-menu}"></div>

    <!-- 배너 -->
    <div
      class="w-full h-[240px] flex items-center justify-center mt-8 overflow-hidden bg-black"
    >
      <img
        src="https://images.unsplash.com/photo-1541278107931-e006523892df?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="게임 배너"
        class="w-full h-full object-cover"
        style="object-position: center"
      />
    </div>

    <!-- 메인 콘텐츠 -->
    <div class="w-full max-w-[1440px] mx-auto mt-8 px-4">
      <div class="bg-white rounded-lg shadow-md p-6">
        <!-- 메인 페이지 화살표 -->
        <div class="relative">
          <!-- 왼쪽 화살표 -->
          <div class="absolute left-[-70px] top-1/2 transform -translate-y-1/2">
            <button onclick="location.href='/party/main-groupbuy'">
              <img
                src="/image/left-arrow.png"
                alt="Left Arrow"
                class="w-8 h-8 cursor-pointer"
              />
            </button>
          </div>

          <!-- 게임 제목과 파티만들기 버튼 -->
          <div class="flex justify-between items-center mb-6">
            <p class="text-3xl font-bold text-gray-800">게임</p>
            <button
              class="px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-lg hover:bg-blue-600 transition"
              th:onclick="|location.href='@{/parties/create-games}'|"
            >
              파티 만들기
            </button>
          </div>
          <!-- 카드 목록 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <div
              th:each="party : ${parties}"
              th:onclick="|location.href='@{/party/detail/{id}(id=${party.id})}'|"
              class="bg-gray-100 border border-gray-300 p-4 rounded-lg shadow-sm cursor-pointer hover:shadow-md transition"
            >
              <!-- 파티 제목 -->
              <p
                class="text-xl font-bold text-gray-800 mt-2"
                th:text="${party.title}"
              >
                파티 제목
              </p>

              <!-- 모집 인원 -->
              <p
                class="text-sm text-gray-600"
                th:text="'모집 인원: ' + ${party.maxMembers} + '명'"
              >
                모집 인원
              </p>

              <!-- 모집 마감일 -->
              <p
                class="text-sm text-gray-600"
                th:text="'모집 마감: ' + ${party.deadline}"
              >
                모집 마감
              </p>
            </div>
          </div>

          <!-- 파티가 없을 경우 안내 메시지 -->
          <div
            th:if="${#lists.isEmpty(parties)}"
            class="text-center text-gray-500 py-10"
          >
            현재 생성된 게임 파티가 없습니다.
          </div>

          <!-- 오른쪽 화살표 -->
          <div
            class="absolute right-[-70px] top-1/2 transform -translate-y-1/2"
          >
            <button onclick="location.href='/party/main-OTT'">
              <img
                src="/image/right-arrow.png"
                alt="Right Arrow"
                class="w-8 h-8 cursor-pointer"
              />
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 푸터 -->
    <div th:replace="~{component/Footer :: footer}"></div>
  </body>
</html>
