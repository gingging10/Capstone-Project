<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공구 파티 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="flex flex-col min-h-screen">
      <!-- 헤더 -->
      <div th:replace="~{component/Header :: header}"></div>

      <!-- 전체 컨테이너: 사이드바 + 본문 -->
      <div class="flex items-start w-full px-4 py-8 flex-1">
        <!-- 사이드바 -->
        <div
          class="w-28 min-h-screen bg-white shadow-md flex flex-col justify-between"
          th:replace="~{component/My-menu :: my-menu}"
        ></div>

        <!-- 메인 컨텐츠 -->
        <div class="flex justify-center flex-1">
          <div class="w-[600px] bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
              공구 파티 만들기
            </h1>
            <form class="space-y-6">
              <!-- 공구할 제품 -->
              <div class="flex flex-col">
                <label
                  for="product"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  공구할 제품
                </label>
                <input
                  id="product"
                  type="text"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="공구 제품 이름 입력"
                />
              </div>

              <!-- 모집 인원 -->
              <div class="flex flex-col">
                <label
                  for="recruitment"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  모집 인원
                </label>
                <input
                  id="recruitment"
                  type="number"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="모집 인원 입력"
                />
              </div>

              <!-- 모집 기간 -->
              <div class="flex flex-col">
                <label
                  for="recruitment-period"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  모집 기간
                </label>
                <input
                  id="recruitment-period"
                  type="date"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <!-- 날짜 -->
              <div class="flex flex-col">
                <label
                  for="date"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  날짜
                </label>
                <input
                  id="date"
                  type="date"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <!-- 인당 가격 -->
              <div class="flex flex-col">
                <label
                  for="price"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  인당 가격
                </label>
                <input
                  id="price"
                  type="number"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="가격 입력"
                />
              </div>

              <!-- 파티 제목 -->
              <div class="flex flex-col">
                <label
                  for="party-title"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  파티 제목
                </label>
                <input
                  id="party-title"
                  type="text"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="파티 제목 입력"
                />
              </div>

              <!-- 오픈 채팅 -->
              <div class="flex flex-col">
                <label
                  for="open-chat"
                  class="text-lg font-medium text-gray-700 mb-2"
                >
                  오픈 채팅
                </label>
                <input
                  id="open-chat"
                  type="text"
                  class="w-full h-12 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="오픈 채팅 링크 입력"
                />
              </div>

              <!-- 만들기 버튼 -->
              <div class="flex justify-center">
                <button
                  type="submit"
                  class="w-full h-12 bg-blue-500 text-white font-medium text-lg rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  파티 만들기
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- 푸터 -->
      <div th:replace="~{component/Footer :: footer}"></div>
    </div>
  </body>
</html>
